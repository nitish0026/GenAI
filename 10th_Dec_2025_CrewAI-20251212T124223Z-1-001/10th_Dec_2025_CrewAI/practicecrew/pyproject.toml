[project]
name = "practicecrew"
version = "0.1.0"
description = "practiceCrew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.7.2",
]

[project.scripts]
practicecrew = "practicecrew.main:run"
run_crew = "practicecrew.main:run"
train = "practicecrew.main:train"
replay = "practicecrew.main:replay"
test = "practicecrew.main:test"
run_with_trigger = "practicecrew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
