research_task:
  description: >
    Conduct a through research on the the financial and future outlook of {company_name}.
    Focus on below topics:
    1. Historical Performance
    2. Market Position and Competitors
    3. Future Growth Opportunities
    4. Potential Risks and Challenges
    5. Financial Health and Market Position
    Make sure to organize your findings in a structured format with clear sections.
  expected_output: >
   A comprehensive research document with well-organized sections covering
    all the requested aspects of {company_name}. Include specific facts, figures,
    and examples where relevant.
  agent: researcher

reporting_task:
  description: >
    Analyze the research findings and create a comprehensive report on {company_name}.
    Your report should:
    1. Begin with an executive summary
    2. Include all key information from the research
    3. Provide insightful analysis of trends and patterns
    4. Offer a market outlook for company, noting that this should not be used for trading decisions
    5. Be formatted in a professional, easy-to-read style with clear headings
  expected_output: >
    A polished, professional report on {company_name} that presents the research
    findings with added analysis and insights. The report should be well-structured
    with an executive summary, main sections, and conclusion.
  agent: reporting_analyst
  context:
    - research_task
  output_file: output/report.md
